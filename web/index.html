<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커뮤니티 검색</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f4f6f8; --panel:#fff; --line:#dee4ea; --line-soft:#eef1f5;
    --ink:#0f151b; --ink-2:#36404b; --muted:#5b6673;
    --accent:#0e5c84; --accent-ink:#fff; --accent-soft:#e3eef5;
    --warm:#8a5510; --warm-soft:#f8efe0; --err:#a3352a;
    --chip:#e9eef3; --shadow:0 1px 2px rgba(15,25,35,.05), 0 1px 8px rgba(15,25,35,.03);
    /* 커뮤니티마다 다른 색조 — 결과를 훑을 때 어디 글인지 바로 보이게. 브랜드색이 아니라 구분용이다. */
    --c-dcsearch:#3f6f9c; --c-arca:#6a5c9e; --c-ppomppu:#a45f3a; --c-dogdrip:#3f7f66; --c-ruliweb:#8a5170;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f1317; --panel:#171c22; --line:#272f39; --line-soft:#1f262e;
      --ink:#e9edf2; --ink-2:#c0c9d3; --muted:#8a95a2;
      --accent:#63b5df; --accent-ink:#09131a; --accent-soft:#142936;
      --warm:#dda65e; --warm-soft:#2a2216; --err:#e17a6c;
      --chip:#202730; --shadow:none;
      --c-dcsearch:#7fa9cf; --c-arca:#a094d0; --c-ppomppu:#d09271;
      --c-dogdrip:#71b598; --c-ruliweb:#c28aa6;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1317; --panel:#171c22; --line:#272f39; --line-soft:#1f262e;
    --ink:#e9edf2; --ink-2:#c0c9d3; --muted:#8a95a2;
    --accent:#63b5df; --accent-ink:#09131a; --accent-soft:#142936;
    --warm:#dda65e; --warm-soft:#2a2216; --err:#e17a6c;
    --chip:#202730; --shadow:none;
    --c-dcsearch:#7fa9cf; --c-arca:#a094d0; --c-ppomppu:#d09271; --c-dogdrip:#71b598; --c-ruliweb:#c28aa6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:940px;margin:0 auto;padding-inline:16px;padding-block:0 56px}

  /* ── 검색 ── */
  .hero{padding-block:30px 4px}
  h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.025em}
  .lede{margin:5px 0 18px;color:var(--muted);font-size:13.5px}
  .sbox{display:flex;gap:9px}
  #q{flex:1;min-width:0;font:inherit;font-size:16px;padding:13px 15px;
    border:1px solid var(--line);border-radius:11px;background:var(--panel);
    color:var(--ink);box-shadow:var(--shadow)}
  #q::placeholder{color:var(--muted)}
  #q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  #go{font:inherit;font-size:15px;font-weight:600;padding:13px 26px;border-radius:11px;
    border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
  #go:hover:not(:disabled){filter:brightness(1.1)}
  #go:disabled{opacity:.45;cursor:not-allowed}

  /* 찾을 곳 — 접지 않는다. 어디를 뒤지는지가 결과 수를 좌우한다. */
  .scope{margin-top:14px;border:1px solid var(--line);border-radius:11px;
    background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
  .sitecard{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;
    padding:10px 13px;border-bottom:1px solid var(--line-soft)}
  .sitecard:last-child{border-bottom:0}
  .sw{appearance:none;width:17px;height:17px;margin:4px 0 0;border:1.5px solid var(--line);
    border-radius:5px;background:var(--bg);cursor:pointer;position:relative;flex:0 0 auto}
  .sw:checked{background:var(--sc,var(--accent));border-color:transparent}
  .sw:checked::after{content:'';position:absolute;left:5px;top:1.5px;width:4px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
  .sname{font-weight:600;font-size:14px;color:var(--ink);display:flex;gap:7px;align-items:center}
  .sname .dot{width:8px;height:8px;border-radius:50%;background:var(--sc,var(--muted));flex:0 0 auto}
  .sname .wide{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:99px;
    background:var(--chip);color:var(--muted);letter-spacing:.02em}
  .boards{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .bd{font:inherit;font-size:12.5px;padding:3px 10px;border-radius:99px;cursor:pointer;
    border:1px solid var(--line);background:var(--bg);color:var(--muted)}
  .bd:hover{border-color:var(--muted)}
  .bd[aria-pressed="true"]{background:var(--sc,var(--accent));border-color:transparent;color:#fff;font-weight:500}
  .sitecard.off .boards{display:none}
  .sitecard.off .sname{color:var(--muted)}

  details.opt{margin-top:11px}
  details.opt>summary{font-size:12.5px;color:var(--muted);cursor:pointer;list-style:none;
    display:inline-flex;gap:5px;align-items:center;user-select:none}
  details.opt>summary::-webkit-details-marker{display:none}
  details.opt>summary::before{content:'▸';font-size:9px}
  details.opt[open]>summary::before{content:'▾'}
  .nums{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding:14px;
    border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .nums label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
  .nums input{font:inherit;font-size:14px;padding:7px 10px;width:112px;
    border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  .nums .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
  .plan{font-size:12.5px;color:var(--muted);margin-top:9px}

  /* ── 진행 ── */
  #prog{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:11px;
    background:var(--panel);display:flex;gap:13px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .75s linear infinite;flex:0 0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
  #progText{flex:1;min-width:150px;font-size:14px}
  #progText b{font-weight:600}
  .psub{color:var(--muted);font-size:12.5px;margin-top:1px}
  #cancel{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}

  .msg{margin-top:16px;padding:12px 14px;border-radius:11px;font-size:13.5px;line-height:1.6}
  .msg.err{background:color-mix(in srgb,var(--err) 11%,transparent);color:var(--err)}
  .msg.warn{background:var(--warm-soft);color:var(--warm)}

  /* ── 결과 ── */
  .rhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:28px 0 11px}
  .rhead h2{margin:0;font-size:15px;font-weight:650;flex:1;min-width:130px;letter-spacing:-.015em}
  .rhead .n{color:var(--muted);font-size:13px}
  .rhead button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .rhead button:hover{border-color:var(--muted)}

  .filters{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
  .frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .frow .lbl{font-size:11.5px;color:var(--muted);min-width:52px}
  .fc{font:inherit;font-size:12.5px;padding:3px 11px;border-radius:99px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);
    display:inline-flex;gap:6px;align-items:baseline}
  .fc:hover{border-color:var(--muted)}
  .fc[aria-pressed="true"]{background:var(--fcc,var(--accent));border-color:transparent;color:#fff;font-weight:500}
  .fc .c{font-size:11px;opacity:.8}
  .more{font:inherit;font-size:12px;color:var(--accent);background:none;border:0;cursor:pointer;padding:3px 6px}

  .list{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;box-shadow:var(--shadow)}
  .row{display:grid;grid-template-columns:5px 88px minmax(0,1fr);gap:0 13px;
    border-bottom:1px solid var(--line-soft)}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--line-soft)}
  .stripe{background:var(--sc,var(--line))}
  .rbody{padding:13px 16px 13px 3px;min-width:0}
  .when{font-size:12.5px;color:var(--muted);padding:15px 0 0}
  @media(max-width:560px){
    .row{grid-template-columns:4px minmax(0,1fr)}
    .when{display:none}
    .rbody{padding:12px 14px 12px 4px}
  }
  .meta{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;margin-bottom:3px}
  .src{font-size:11.5px;font-weight:600;color:var(--sc,var(--muted))}
  .gall{font-size:11.5px;color:var(--muted)}
  .gall::before{content:'·';margin-right:6px;opacity:.6}
  .dm{display:none;font-size:11.5px;color:var(--muted)}
  @media(max-width:560px){.dm{display:inline}}
  .price{font-size:11.5px;padding:1px 8px;border-radius:5px;background:var(--warm-soft);
    color:var(--warm);font-weight:500}
  .ti{color:var(--ink);text-decoration:none;font-weight:500;line-height:1.48}
  .ti:hover{color:var(--accent);text-decoration:underline}
  .ex{color:var(--muted);font-size:13px;margin-top:4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .none{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.75}

  .recent{margin-top:28px}
  .recent h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin:0 0 10px}
  .rlist{display:flex;gap:7px;flex-wrap:wrap}
  .rq{font:inherit;font-size:13px;padding:5px 13px;border-radius:99px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
    display:inline-flex;gap:8px;align-items:baseline}
  .rq:hover{border-color:var(--muted)}
  .rq .c{font-size:11.5px;color:var(--muted)}

  #log{margin-top:13px;background:var(--chip);border-radius:10px;padding:10px 13px;
    max-height:140px;overflow:auto;white-space:pre-wrap;
    font:11.5px/1.55 "IBM Plex Mono",ui-monospace,Consolas,monospace;color:var(--muted)}
  button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>커뮤니티 검색</h1>
    <p class="lede">찾고 싶은 말을 치면 커뮤니티를 돌아 지금 올라와 있는 글을 찾아옵니다.</p>

    <div class="sbox">
      <input id="q" placeholder="예) 에픽 무료배포" autocomplete="off" aria-label="검색어">
      <button id="go">찾기</button>
    </div>

    <div class="scope" id="scope"></div>

    <details class="opt">
      <summary>얼마나 깊이 찾을지</summary>
      <div class="nums">
        <div>
          <label for="pages">쪽수</label>
          <input id="pages" type="number" min="1" max="5" value="1">
          <div class="hint">많을수록 느립니다</div>
        </div>
        <div>
          <label for="bodies">본문 가져올 글</label>
          <input id="bodies" type="number" min="0" max="60" value="0">
          <div class="hint">0이면 제목만 (빠름)</div>
        </div>
        <div>
          <label for="since">이 날짜 이후</label>
          <input id="since" type="date">
          <div class="hint">비우면 전체</div>
        </div>
      </div>
    </details>
    <div class="plan" id="plan"></div>
  </div>

  <div id="prog" hidden>
    <span class="spin"></span>
    <div id="progText"></div>
    <button id="cancel">그만</button>
  </div>
  <div id="alert"></div>
  <div id="log" hidden></div>

  <div id="results" hidden>
    <div class="rhead">
      <h2 id="rtitle"></h2>
      <span class="n" id="rcount"></span>
      <button id="copy">표로 복사</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
  </div>

  <div class="recent" id="recentBox" hidden>
    <h2>최근 검색</h2>
    <div class="rlist" id="recent"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const TOKEN = new URLSearchParams(location.search).get('token') ?? '';
const api = (p, o) => fetch(p + (p.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN), o);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let SITES = [];                 // [{id,label,wide,boards:[{id,name,on}]}]
const on = new Set();           // 켜진 사이트
const boardsOn = {};            // 사이트id -> Set(게시판id)
let rows = [], shown = [], fSite = null, fBoard = null, allBoards = false, es = null, funnel = {};

const alertBox = (k, html) => { $('alert').innerHTML = html ? `<div class="msg ${k}">${html}</div>` : ''; };
const siteName = (id) => SITES.find((s) => s.id === id)?.label ?? id;
const boardName = (sid, bid) =>
  SITES.find((s) => s.id === sid)?.boards.find((b) => b.id === bid)?.name ?? bid;

// 이 게시판들의 제목은 구조를 품고 있다: "[스팀] Deadshot (무료/무료)".
function parseTitle(t) {
  let rest = String(t).trim(), source = '', price = '';
  const head = rest.match(/^\[\s*([^\]]{1,20})\s*\]\s*/);
  if (head) { source = head[1].trim(); rest = rest.slice(head[0].length); }
  const tail = rest.match(/\(\s*([^()]{1,28}?(?:원|무료|free)[^()]{0,16})\s*\)\s*$/i);
  if (tail) { price = tail[1].trim().replace(/\s+/g, ' '); rest = rest.slice(0, tail.index).trim(); }
  return { source, price, text: rest || t };
}

// ── 찾을 곳 ─────────────────────────────────────────────────────────────
async function loadSites() {
  SITES = (await (await api('/api/sites')).json()).sites ?? [];
  for (const s of SITES) {
    on.add(s.id);
    boardsOn[s.id] = new Set(s.boards.filter((b) => b.on).map((b) => b.id));
    if (!boardsOn[s.id].size && s.boards.length) boardsOn[s.id].add(s.boards[0].id);
  }
  drawScope();
}

function drawScope() {
  $('scope').innerHTML = SITES.map((s) => `
    <div class="sitecard ${on.has(s.id) ? '' : 'off'}" style="--sc:var(--c-${esc(s.id)})">
      <input class="sw" type="checkbox" id="sw_${esc(s.id)}" ${on.has(s.id) ? 'checked' : ''}
             aria-label="${esc(s.label)} 켜기">
      <div>
        <label class="sname" for="sw_${esc(s.id)}">
          <span class="dot"></span>${esc(s.label)}
          ${s.wide ? '<span class="wide">사이트 전체</span>' : ''}
        </label>
        ${s.boards.length > 1 ? `<div class="boards">${s.boards.map((b) => `
          <button class="bd" type="button" data-s="${esc(s.id)}" data-b="${esc(b.id)}"
            aria-pressed="${boardsOn[s.id].has(b.id)}">${esc(b.name)}</button>`).join('')}</div>` : ''}
      </div>
    </div>`).join('');

  for (const s of SITES) {
    $('sw_' + s.id).onchange = (e) => {
      if (e.target.checked) on.add(s.id); else on.delete(s.id);
      if (!on.size) { on.add(s.id); e.target.checked = true; }   // 전부 끄면 찾을 곳이 없다
      drawScope();
    };
  }
  for (const b of $('scope').querySelectorAll('.bd')) {
    b.onclick = () => {
      const set = boardsOn[b.dataset.s];
      if (set.has(b.dataset.b)) set.delete(b.dataset.b); else set.add(b.dataset.b);
      if (!set.size) set.add(b.dataset.b);      // 그 사이트에서 뒤질 곳이 없어진다
      drawScope();
    };
  }
  plan();
}

function plan() {
  const pages = Number($('pages').value) || 1;
  const words = $('q').value.split(/[,\n]/).map((s) => s.trim()).filter(Boolean).length || 1;
  let n = 0;
  for (const s of SITES) {
    if (!on.has(s.id)) continue;
    const nb = boardsOn[s.id].size;
    n += nb * (s.id === 'ruliweb' ? 2 : words * pages);
  }
  const sec = Math.round(n * 1.7);
  $('plan').textContent = n
    ? `요청 약 ${n}회 · 대략 ${Math.floor(sec / 60)}분 ${sec % 60}초`
    : '찾을 곳을 하나 이상 고르세요';
}
for (const id of ['q', 'pages']) $(id).addEventListener('input', plan);

async function loadRecent() {
  const r = await (await api('/api/history')).json();
  const list = (r.searches ?? []).filter((s) => s.count > 0).slice(0, 10);
  $('recentBox').hidden = !list.length;
  $('recent').innerHTML = list.map((s) => `
    <button class="rq" data-id="${esc(s.id)}" data-q="${esc(s.q)}">
      ${esc(s.q)}<span class="c">${s.count}</span></button>`).join('');
  for (const b of $('recent').querySelectorAll('.rq')) {
    b.onclick = () => { $('q').value = b.dataset.q; show(b.dataset.id); };
  }
}

// ── 검색 ────────────────────────────────────────────────────────────────
async function search() {
  const q = $('q').value.trim();
  if (!q) { $('q').focus(); return; }
  alertBox('', ''); funnel = {}; fSite = null; fBoard = null; allBoards = false;
  $('results').hidden = true;
  $('log').hidden = false; $('log').textContent = '';
  $('prog').hidden = false;
  $('progText').innerHTML = '<b>시작하는 중…</b>';
  $('go').disabled = true;

  const boards = {};
  for (const id of on) boards[id] = [...boardsOn[id]];
  const res = await api('/api/search', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      q, sites: [...on], boards,
      pages: Number($('pages').value) || 1,
      bodies: Number($('bodies').value) || 0,
      since: $('since').value || null,
    }),
  });
  const j = await res.json();
  if (!res.ok) {
    $('prog').hidden = true; $('go').disabled = false;
    return alertBox('err', esc(j.error ?? '시작하지 못했습니다'));
  }
  listen(j.id, q);
}

function listen(id, q) {
  es?.close();
  es = new EventSource('/api/stream?token=' + encodeURIComponent(TOKEN));
  es.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type === 'at') {
      $('progText').innerHTML = `<b>${esc(d.where)}</b> 에서 찾는 중<div class="psub">${d.found}건 찾음</div>`;
    }
    if (d.type === 'line') {
      const el = $('log');
      const bottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
      el.textContent += d.line + '\n';
      if (bottom) el.scrollTop = el.scrollHeight;
      let m;
      if ((m = d.line.match(/목록에서 읽은 글 (\d+) → 중복 (\d+) · 키워드탈락 (\d+) · 기간밖 (\d+)/)))
        funnel = { ...funnel, read: +m[1], dup: +m[2], filtered: +m[3], old: +m[4] };
      if ((m = d.line.match(/요청 \d+ \(성공 (\d+) \/ 실패 (\d+) \/ 차단응답 (\d+) \/ robots거부 (\d+)/)))
        funnel = { ...funnel, ok: +m[1], fail: +m[2], blocked: +m[3], robots: +m[4] };
    }
    if (d.type === 'done') {
      es.close();
      $('prog').hidden = true; $('go').disabled = false;
      explain(d, q); show(id); loadRecent();
    }
  };
  es.onerror = () => { es.close(); $('prog').hidden = true; $('go').disabled = false; };
}

// 0건이 나와도 '왜 0건인지'가 보여야 도구를 믿을 수 있다.
function explain(d, q) {
  const f = funnel;
  if (d.code !== 0) return alertBox('warn', `검색이 코드 ${d.code} 로 끝났습니다. 아래 기록을 보세요.`);
  if (d.count > 0) { alertBox('', ''); $('log').hidden = true; return; }
  if (f.robots > 0 && !f.ok) return alertBox('warn', 'robots.txt 가 막아서 요청하지 않았습니다. 다른 곳을 골라 보세요.');
  if (f.blocked > 0) return alertBox('warn', `차단 응답을 ${f.blocked}번 받았습니다. 잠시 뒤 다시 해보세요.`);
  if (f.read > 0 && f.filtered === f.read) {
    return alertBox('warn', `${f.read}건을 읽었지만 <b>${esc(q)}</b> 가 제목에 없어 전부 걸러졌습니다. `
      + '더 짧은 말로 찾거나, 디시처럼 본문까지 뒤지는 곳을 켜보세요.');
  }
  if (f.old > 0 && f.read > 0 && f.old + f.filtered === f.read) {
    return alertBox('warn', `${f.old}건이 '이 날짜 이후' 조건에서 빠졌습니다. 날짜를 비워보세요.`);
  }
  alertBox('warn', '찾은 글이 없습니다. 더 짧거나 흔한 말로 해보세요.');
}

async function show(id) {
  const r = await (await api('/api/results?id=' + encodeURIComponent(id))).json();
  if (r.error) return alertBox('err', esc(r.error));
  rows = (r.rows ?? []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  $('rtitle').textContent = `"${r.q}" 결과`;
  $('copy').hidden = !rows.length;
  $('results').hidden = false;
  fSite = null; fBoard = null; allBoards = false;
  draw();
}

// 커뮤니티 → 그 안의 게시판/갤러리 두 단계로 골라볼 수 있게 한다.
function draw() {
  const bySite = {};
  for (const x of rows) bySite[x.site] = (bySite[x.site] || 0) + 1;
  const sites = Object.keys(bySite).sort((a, b) => bySite[b] - bySite[a]);

  const inSite = fSite ? rows.filter((x) => x.site === fSite) : rows;
  const byBoard = {};
  for (const x of inSite) { const k = x.board || '(기타)'; byBoard[k] = (byBoard[k] || 0) + 1; }
  const boards = Object.keys(byBoard).sort((a, b) => byBoard[b] - byBoard[a]);
  const LIMIT = 10;
  const showBoards = allBoards ? boards : boards.slice(0, LIMIT);

  const chip = (label, count, pressed, data, color) =>
    `<button class="fc" aria-pressed="${pressed}" ${data} ${color ? `style="--fcc:var(--c-${color})"` : ''}>`
    + `${esc(label)}<span class="c">${count}</span></button>`;

  let html = `<div class="frow"><span class="lbl">커뮤니티</span>`
    + chip('전체', rows.length, !fSite, 'data-site=""')
    + sites.map((s) => chip(siteName(s), bySite[s], fSite === s, `data-site="${esc(s)}"`, s)).join('')
    + `</div>`;

  if (boards.length > 1) {
    html += `<div class="frow"><span class="lbl">${fSite === 'dcsearch' ? '갤러리' : '게시판'}</span>`
      + chip('전체', inSite.length, !fBoard, 'data-board=""')
      + showBoards.map((b) => chip(fSite ? boardName(fSite, b) : b, byBoard[b], fBoard === b, `data-board="${esc(b)}"`)).join('')
      + (boards.length > LIMIT
        ? `<button class="more" id="moreBtn">${allBoards ? '접기' : `+${boards.length - LIMIT}개 더`}</button>` : '')
      + `</div>`;
  }
  $('filters').innerHTML = html;

  for (const b of $('filters').querySelectorAll('.fc')) {
    b.onclick = () => {
      if (b.dataset.site !== undefined) { fSite = b.dataset.site || null; fBoard = null; allBoards = false; }
      else fBoard = b.dataset.board || null;
      draw();
    };
  }
  const mb = $('moreBtn');
  if (mb) mb.onclick = () => { allBoards = !allBoards; draw(); };

  shown = inSite.filter((x) => !fBoard || (x.board || '(기타)') === fBoard);
  $('rcount').textContent = shown.length === rows.length ? `${rows.length}건` : `${shown.length} / ${rows.length}건`;

  $('list').innerHTML = shown.length ? shown.map((x) => {
    const p = parseTitle(x.title);
    const wide = SITES.find((s) => s.id === x.site)?.wide;
    const sub = wide ? x.board : (x.board && x.board !== x.site ? boardName(x.site, x.board) : '');
    return `<article class="row" style="--sc:var(--c-${esc(x.site)})">
      <div class="stripe"></div>
      <div class="when mono">${esc(x.date || '—')}</div>
      <div class="rbody">
        <div class="meta">
          <span class="src">${esc(siteName(x.site))}</span>
          ${sub ? `<span class="gall">${esc(sub)}</span>` : ''}
          ${p.price ? `<span class="price">${esc(p.price)}</span>` : ''}
          <span class="dm mono">${esc(x.date || '')}</span>
        </div>
        <a class="ti" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(p.text)}</a>
        ${x.body ? `<div class="ex">${esc(x.body.slice(0, 200))}</div>` : ''}
      </div>
    </article>`;
  }).join('') : '<div class="none">여기서는 찾은 글이 없습니다.</div>';
}

$('copy').onclick = async () => {
  const tsv = [['날짜', '커뮤니티', '게시판', '제목', '주소'].join('\t'),
    ...shown.map((r) => [r.date, siteName(r.site), r.board ?? '', r.title.replace(/\s+/g, ' '), r.url].join('\t')),
  ].join('\n');
  try { await navigator.clipboard.writeText(tsv); $('copy').textContent = `${shown.length}건 복사함`; }
  catch { $('copy').textContent = '복사 실패'; }
  setTimeout(() => { $('copy').textContent = '표로 복사'; }, 1800);
};

$('go').onclick = search;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
$('cancel').onclick = () => api('/api/stop', { method: 'POST' });

loadSites().then(loadRecent);
$('q').focus();
</script>
</body>
